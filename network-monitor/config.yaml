name: "Network Monitor"
version: "1.1.1"
slug: "network_monitor"
description: "ICMP infrastructure monitoring with MQTT and Discord alerts"
startup: services
boot: auto
init: false
host_network: true

arch:
  - aarch64
  - amd64

map:
  - type: app_config
    read_only: false

options:
  monitor_name: "raspberrypi-monitor"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_base_topic: "monitor"
  discord_alert_topic: "discord-ha/alerts"
  hosts: "thoth=192.168.86.252,omoikane=192.168.86.253"
  poll_interval: 15
  ping_timeout: 2
  heartbeat_interval: 60
  failure_threshold: 3
  recovery_threshold: 2
  max_workers: 10
  log_level: "info"
  log_host_status: true

schema:
  monitor_name: str
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_base_topic: str
  discord_alert_topic: str
  hosts: str
  poll_interval: int(1,3600)
  ping_timeout: int(1,60)
  heartbeat_interval: int(5,3600)
  failure_threshold: int(1,100)
  recovery_threshold: int(1,100)
  max_workers: int(1,100)
  log_level: list(debug|info|warning|error)
  log_host_status: bool
