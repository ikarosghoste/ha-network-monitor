configuration:
  monitor_name:
    name: Monitor name
    description: Unique identifier for this monitoring instance.
  mqtt_host:
    name: MQTT broker host
  mqtt_port:
    name: MQTT broker port
  mqtt_username:
    name: MQTT username
  mqtt_password:
    name: MQTT password
  mqtt_base_topic:
    name: MQTT base topic
  discord_alert_topic:
    name: Discord alert topic
    description: MQTT topic consumed by your Discord notification bot.
  hosts:
    name: Hosts to monitor
    description: Comma-separated name=address entries.
  poll_interval:
    name: Poll interval (seconds)
  ping_timeout:
    name: Ping timeout (seconds)
  heartbeat_interval:
    name: Heartbeat interval (seconds)
  failure_threshold:
    name: Failure threshold
    description: Consecutive failed pings before a host is marked offline.
  recovery_threshold:
    name: Recovery threshold
    description: Consecutive successful pings before a host is marked online again.
  max_workers:
    name: Concurrent ping workers
  log_level:
    name: Log level
  log_host_status:
    name: Log host status
    description: Write each host's current state to the app log on each polling cycle.
